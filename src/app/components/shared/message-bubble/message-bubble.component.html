<!-- Separador de fecha si cambia de día o al inicio -->
<div *ngIf="showDateDivider" class="chat-date-divider">
  <span class="date-badge">{{ dateDividerText }}</span>
</div>

<div class="message-bubble-wrapper"
  [ngClass]="{'sent': msg.tipo === 'sent', 'received': msg.tipo === 'received', 'highlighted': isHighlighted}">
  <div class="message-bubble"
    [ngClass]="{'has-media': msg.mediaUrl, 'media-only': msg.mediaUrl && isOnlyMediaWithoutCaption}">

    <!-- Renderizado de Imagen -->
    <div *ngIf="isImage && msg.mediaUrl" class="chat-media-container chat-image-container"
      (click)="abrirMedia(msg.mediaUrl)">
      <img [src]="msg.mediaUrl" [alt]="msg.fileName || 'Imagen adjunta'" class="chat-image-preview" loading="lazy" />
    </div>

    <!-- Renderizado de Video -->
    <div *ngIf="isVideo && msg.mediaUrl" class="chat-media-container chat-video-container">
      <video [src]="msg.mediaUrl" controls class="chat-video-player"></video>
    </div>

    <!-- Renderizado de Audio / Nota de voz -->
    <div *ngIf="isAudio && msg.mediaUrl" class="chat-media-container chat-audio-container">
      <audio [src]="msg.mediaUrl" controls class="chat-audio-player"></audio>
    </div>

    <!-- Renderizado de Documento / Archivo -->
    <div *ngIf="isDocument" class="chat-media-container chat-doc-container" (click)="abrirMedia(msg.mediaUrl)">
      <div class="doc-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z" />
        </svg>
      </div>
      <div class="doc-info">
        <span class="doc-name">{{ msg.fileName || 'Documento adjunto' }}</span>
        <span *ngIf="msg.fileSize" class="doc-size">{{ formatFileSize(msg.fileSize) }}</span>
      </div>
      <a *ngIf="msg.mediaUrl" [href]="msg.mediaUrl" target="_blank" download class="doc-download-btn"
        (click)="$event.stopPropagation()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
        </svg>
      </a>
    </div>

    <!-- Contenido del texto con formato WhatsApp (negritas, cursivas, saltos de línea, listas, links) -->
    <div *ngIf="!isOnlyMediaWithoutCaption || !msg.mediaUrl" class="message-content" [innerHTML]="formattedHtml"></div>

    <!-- Botones interactivos / quick replies adjuntos a este mensaje -->
    <div *ngIf="msg.botones && msg.botones.length > 0" class="message-buttons-container">
      <button *ngFor="let boton of msg.botones" type="button" class="message-quick-btn" (click)="onBotonClick(boton)">
        {{ boton.label }}
      </button>
    </div>

    <!-- Metadata: Hora y palomitas de lectura estilo WhatsApp / Messenger -->
    <div class="message-meta">
      <span class="message-time">{{ displayTime }}</span>

      <!-- Doble palomita (checks) solo para mensajes enviados por mí -->
      <span *ngIf="msg.tipo === 'sent'" class="message-checks" [ngClass]="{'read': msg.isRead || msg.status === 'read'}"
        [title]="msg.isRead ? 'Leído' : 'Enviado'">
        <svg class="check-icon" viewBox="0 0 16 15" width="16" height="15" fill="none">
          <path
            d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512zm-4.1 0l-.478-.372a.365.365 0 0 0-.51.063L4.566 9.879a.32.32 0 0 1-.484.033L1.891 7.769a.366.366 0 0 0-.515.006l-.423.433a.364.364 0 0 0 .006.514l3.258 3.185c.143.14.361.125.484-.033l6.272-8.048a.365.365 0 0 0-.063-.51z"
            fill="currentColor" />
        </svg>
      </span>
    </div>
  </div>
</div>
