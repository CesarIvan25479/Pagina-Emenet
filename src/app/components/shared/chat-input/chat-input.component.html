<div class="chat-input-root">
  <!-- Inputs ocultos para adjuntar -->
  <input #inputDoc type="file" multiple (change)="onFilesPicked($event)" class="hidden"
    accept="application/pdf,text/html,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt" />
  <input #inputMedia type="file" multiple (change)="onFilesPicked($event)" class="hidden" accept="image/*,video/*" />
  <input #inputCamera type="file" multiple (change)="onFilesPicked($event)" class="hidden" accept="image/*"
    capture="environment" />
  <input #inputAudio type="file" multiple (change)="onFilesPicked($event)" class="hidden" accept="audio/*" />

  <!-- Menú de adjuntos idéntico al de Neurexa -->
  <div class="chat-attach-menu shadow-2xl" *ngIf="showAttachMenu">
    <button type="button" class="attach-item" (click)="inputDoc.click()">
      <span class="attach-circle bg-blue-100 text-blue-600">
        <!-- MdInsertDriveFile SVG -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z">
          </path>
        </svg>
      </span>
      <div class="attach-info">
        <span class="attach-name">Documento</span>
        <span class="attach-desc">PDF, Word, Excel, etc.</span>
      </div>
      <!-- MdAttachFile SVG -->
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="attach-tail-icon">
        <path
          d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z">
        </path>
      </svg>
    </button>

    <div class="attach-divider"></div>

    <button type="button" class="attach-item" (click)="inputMedia.click()">
      <span class="attach-circle bg-emerald-100 text-emerald-600">
        <!-- MdPhotoLibrary SVG -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path
            d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4 2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z">
          </path>
        </svg>
      </span>
      <div class="attach-info">
        <span class="attach-name">Fotos y videos</span>
        <span class="attach-desc">Galería</span>
      </div>
    </button>

    <div class="attach-divider"></div>

    <button type="button" class="attach-item" (click)="inputCamera.click()">
      <span class="attach-circle bg-purple-100 text-purple-600">
        <!-- MdCameraAlt SVG -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path
            d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z">
          </path>
        </svg>
      </span>
      <div class="attach-info">
        <span class="attach-name">Cámara</span>
        <span class="attach-desc">Tomar foto o video</span>
      </div>
    </button>

    <div class="attach-divider"></div>

    <button type="button" class="attach-item" (click)="inputAudio.click()">
      <span class="attach-circle bg-rose-100 text-rose-600">
        <!-- MdMic SVG -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
          <path
            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z">
          </path>
        </svg>
      </span>
      <div class="attach-info">
        <span class="attach-name">Audio</span>
        <span class="attach-desc">Enviar nota de voz</span>
      </div>
    </button>
  </div>

  <!-- Barra de herramientas de formato de texto: {showFormatToolbar && !isReadOnly ? ( ... ) : null} -->
  <div class="chat-format-toolbar shadow-lg" *ngIf="showFormatToolbar && !isReadOnly">
    <button type="button" class="format-btn" (click)="formatText('bold')" title="Negrita (*texto*)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path
          d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z" />
      </svg>
    </button>
    <button type="button" class="format-btn" (click)="formatText('italic')" title="Cursiva (_texto_)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z" />
      </svg>
    </button>
    <button type="button" class="format-btn" (click)="formatText('strike')" title="Tachado (~texto~)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M10 19h4v-3h-4v3zM5 4v3h5v3h4V7h5V4H5zM3 14h18v-2H3v2z" />
      </svg>
    </button>
    <button type="button" class="format-btn" (click)="formatText('code')" title="Monoespaciado (`código`)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" />
      </svg>
    </button>
    <button type="button" class="format-btn" (click)="formatText('quote')" title="Cita (> texto)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z" />
      </svg>
    </button>
    <button type="button" class="format-btn" (click)="formatText('bullet')" title="Lista viñeta (• texto)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path
          d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z" />
      </svg>
    </button>
  </div>

  <!-- Contenedor principal idéntico rounded-3xl con borde sutil -->
  <div class="chat-input-box">
    <!-- Botón Plus SVG idéntico (Plus de animate-ui) -->
    <div class="chat-input-left-btn">
      <button type="button" (click)="toggleAttachMenu()" class="icon-action-btn plus-btn" title="Adjuntar archivo">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- Botón IconoEmoji SVG exacto de Neurexa (wds-ic-sticker-smiley) -->
    <div class="chat-input-emoji-btn">
      <button type="button" (click)="onEmojiClick()" class="icon-action-btn emoji-btn" title="Emojis">
        <svg viewBox="0 0 24 24" height="26" width="26" preserveAspectRatio="xMidYMid meet" fill="currentColor">
          <title>wds-ic-sticker-smiley</title>
          <path
            d="M8.49893 10.2521C9.32736 10.2521 9.99893 9.5805 9.99893 8.75208C9.99893 7.92365 9.32736 7.25208 8.49893 7.25208C7.6705 7.25208 6.99893 7.92365 6.99893 8.75208C6.99893 9.5805 7.6705 10.2521 8.49893 10.2521Z"
            fill="currentColor"></path>
          <path
            d="M17.0011 8.75208C17.0011 9.5805 16.3295 10.2521 15.5011 10.2521C14.6726 10.2521 14.0011 9.5805 14.0011 8.75208C14.0011 7.92365 14.6726 7.25208 15.5011 7.25208C16.3295 7.25208 17.0011 7.92365 17.0011 8.75208Z"
            fill="currentColor"></path>
          <path fillRule="evenodd" clipRule="evenodd"
            d="M16.8221 19.9799C15.5379 21.2537 13.8087 21.9781 12 22H9.27273C5.25611 22 2 18.7439 2 14.7273V9.27273C2 5.25611 5.25611 2 9.27273 2H14.7273C18.7439 2 22 5.25611 22 9.27273V11.8141C22 13.7532 21.2256 15.612 19.8489 16.9776L16.8221 19.9799ZM14.7273 4H9.27273C6.36068 4 4 6.36068 4 9.27273V14.7273C4 17.6393 6.36068 20 9.27273 20H11.3331C11.722 19.8971 12.0081 19.5417 12.0058 19.1204L11.9935 16.8564C11.9933 16.8201 11.9935 16.784 11.9941 16.7479C11.0454 16.7473 10.159 16.514 9.33502 16.0479C8.51002 15.5812 7.84752 14.9479 7.34752 14.1479C7.24752 13.9479 7.25585 13.7479 7.37252 13.5479C7.48919 13.3479 7.66419 13.2479 7.89752 13.2479L13.5939 13.2479C14.4494 12.481 15.5811 12.016 16.8216 12.0208L19.0806 12.0296C19.5817 12.0315 19.9889 11.6259 19.9889 11.1248V9.07648H19.9964C19.8932 6.25535 17.5736 4 14.7273 4ZM14.0057 19.1095C14.0066 19.2605 13.9959 19.4089 13.9744 19.5537C14.5044 19.3124 14.9926 18.9776 15.4136 18.5599L18.4405 15.5576C18.8989 15.1029 19.2653 14.5726 19.5274 13.996C19.3793 14.0187 19.2275 14.0301 19.0729 14.0295L16.8138 14.0208C15.252 14.0147 13.985 15.2837 13.9935 16.8455L14.0057 19.1095Z"
            fill="currentColor"></path>
        </svg>
      </button>
    </div>

    <!-- Textarea para escribir mensaje (muestra la barra al seleccionar texto como WhatsApp) -->
    <textarea id="chatInputTextarea" rows="1" [(ngModel)]="message" (input)="onInput($event)"
      (select)="onTextSelect($event)" (mouseup)="onTextSelect($event)" (keyup)="onTextSelect($event)"
      (blur)="onTextareaBlur()" (keydown)="onKeyDown($event)" placeholder="Escribe un mensaje"
      class="chat-textarea"></textarea>

    <!-- Botón Enviar o Micrófono exactos de Neurexa -->
    <div class="chat-input-right-btn">
      <!-- Si hay texto: Botón Enviar wds-ic-send-filled -->
      <button *ngIf="message && message.trim()" type="button" (click)="sendMessage()" class="send-btn"
        title="Enviar mensaje">
        <svg viewBox="0 0 24 24" height="20" width="20" preserveAspectRatio="xMidYMid meet" fill="none">
          <title>wds-ic-send-filled</title>
          <path fill="currentColor"
            d="M5.4 19.43a.99.99 0 0 1-.95-.1.93.93 0 0 1-.45-.83V14l8-2-8-2V5.5c0-.37.15-.65.45-.84a1 1 0 0 1 .95-.09l15.4 6.5c.42.19.63.5.63.93 0 .43-.21.74-.63.93l-15.4 6.5Z">
          </path>
        </svg>
      </button>

      <!-- Si está vacío: IconoMicrofono exacto de Neurexa -->
      <button *ngIf="!message || !message.trim()" type="button" (click)="toggleMicrofono()" class="mic-btn"
        [class.recording]="grabandoAudio" [title]="grabandoAudio ? 'Toca para terminar' : 'Toca para grabar'">
        <svg viewBox="0 0 24 24" height="22" width="22" preserveAspectRatio="xMidYMid meet" fill="currentColor">
          <title>mic-outlined</title>
          <path
            d="M12 14C11.1667 14 10.4583 13.7083 9.875 13.125C9.29167 12.5417 9 11.8333 9 11V5C9 4.16667 9.29167 3.45833 9.875 2.875C10.4583 2.29167 11.1667 2 12 2C12.8333 2 13.5417 2.29167 14.125 2.875C14.7083 3.45833 15 4.16667 15 5V11C15 11.8333 14.7083 12.5417 14.125 13.125C13.5417 13.7083 12.8333 14 12 14ZM12 21C11.4477 21 11 20.5523 11 20V17.925C9.26667 17.6917 7.83333 16.9167 6.7 15.6C5.78727 14.5396 5.24207 13.3387 5.06441 11.9973C4.9919 11.4498 5.44772 11 6 11C6.55228 11 6.98782 11.4518 7.0905 11.9945C7.27271 12.9574 7.73004 13.805 8.4625 14.5375C9.4375 15.5125 10.6167 16 12 16C13.3833 16 14.5625 15.5125 15.5375 14.5375C16.27 13.805 16.7273 12.9574 16.9095 11.9945C17.0122 11.4518 17.4477 11 18 11C18.5523 11 19.0081 11.4498 18.9356 11.9973C18.7579 13.3387 18.2127 14.5396 17.3 15.6C16.1667 16.9167 14.7333 17.6917 13 17.925V20C13 20.5523 12.5523 21 12 21ZM12 12C12.2833 12 12.5208 11.9042 12.7125 11.7125C12.9042 11.5208 13 11.2833 13 11V5C13 4.71667 12.9042 4.47917 12.7125 4.2875C12.5208 4.09583 12.2833 4 12 4C11.7167 4 11.4792 4.09583 11.2875 4.2875C11.0958 4.47917 11 4.71667 11 5V11C11 11.2833 11.0958 11.5208 11.2875 11.7125C11.4792 11.9042 11.7167 12 12 12Z"
            fill="currentColor"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
