<div class="modal-enviar-imagen-overlay" *ngIf="isOpen" (click)="handleBackdrop($event)" (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">

  <!-- Overlay cuando se arrastran archivos dentro del modal -->
  <div class="modal-drag-active-overlay" *ngIf="isDragging">
    <div class="drag-bounce-icon">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
        <path
          d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
      </svg>
    </div>
    <span class="drag-active-text">Suelte los archivos para agregarlos</span>
  </div>

  <!-- Header estilo WhatsApp iOS -->
  <header class="modal-header-ios">
    <div class="header-spacer"></div>

    <div class="header-center">
      <span class="header-title">{{ contactName || 'Enviar' }}</span>
      <span class="header-subtitle">Vista previa</span>
    </div>

    <div class="header-right">
      <button type="button" class="btn-ios-back" (click)="onClose()">
        <span>Atrás</span>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </header>

  <!-- Contenedor central de visor -->
  <main class="modal-preview-viewport">
    <ng-container *ngIf="selectedAttachment as sel">
      <!-- Visor de Imagen con Zoom y Pan -->
      <div *ngIf="sel.kind === 'image' && sel.preview" #contenedorVisor class="visor-image-container"
        (pointerdown)="manejarPointerDown($event)" (pointermove)="manejarPointerMove($event)"
        (pointerup)="manejarPointerUp()" (pointercancel)="manejarPointerUp()" (dblclick)="resetVisor()"
        (wheel)="manejarWheelVisor($event)">
        <img [src]="sel.preview" [alt]="sel.name || 'imagen'" draggable="false" class="visor-image"
          [style.transform]="'translate3d(' + pan.x + 'px, ' + pan.y + 'px, 0) scale(' + zoom + ')'" />
      </div>

      <!-- Visor de Video -->
      <div *ngIf="sel.kind === 'video' && sel.preview" class="visor-video-container">
        <video [src]="sel.preview" controls class="visor-video"></video>
      </div>

      <!-- Visor de Audio -->
      <div *ngIf="sel.kind === 'audio' && sel.preview" class="visor-card-box">
        <div class="audio-card-title">{{ sel.name || 'Audio' }}</div>
        <audio [src]="sel.preview" controls class="visor-audio"></audio>
      </div>

      <!-- Visor de Documento -->
      <div *ngIf="sel.kind === 'document'" class="visor-card-box doc-card-box">
        <ng-container *ngIf="obtenerEstiloDocumento(resolverTipoDocumento(sel)) as estilo">
          <div class="doc-card-header">
            <div class="doc-card-icon"
              [style.background-color]="(resolverTipoDocumento(sel) === 'word' || resolverTipoDocumento(sel) === 'excel' || resolverTipoDocumento(sel) === 'pdf') ? 'transparent' : estilo.bg"
              style="overflow: hidden; padding: 2px;">
              <!-- Word SVG -->
              <svg *ngIf="resolverTipoDocumento(sel) === 'word'" viewBox="0 0 32 32" width="50" height="50"
                xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="meiWordGrad" x1="4.494" y1="-1712.086" x2="13.832" y2="-1695.914"
                    gradientTransform="translate(0 1720)" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#2368c4" />
                    <stop offset=".5" stop-color="#1a5dbe" />
                    <stop offset="1" stop-color="#1146ac" />
                  </linearGradient>
                </defs>
                <path
                  d="M28.806 3H9.705a1.19 1.19 0 0 0-1.193 1.191V9.5l11.069 3.25L30 9.5V4.191A1.19 1.19 0 0 0 28.806 3"
                  style="fill:#41a5ee" />
                <path d="M30 9.5H8.512V16l11.069 1.95L30 16Z" style="fill:#2b7cd3" />
                <path d="M8.512 16v6.5l10.418 1.3L30 22.5V16Z" style="fill:#185abd" />
                <path d="M9.705 29h19.1A1.19 1.19 0 0 0 30 27.809V22.5H8.512v5.309A1.19 1.19 0 0 0 9.705 29"
                  style="fill:#103f91" />
                <path d="M16.434 8.2H8.512v16.25h7.922a1.2 1.2 0 0 0 1.194-1.191V9.391A1.2 1.2 0 0 0 16.434 8.2"
                  style="opacity:.1;isolation:isolate" />
                <path d="M15.783 8.85H8.512V25.1h7.271a1.2 1.2 0 0 0 1.194-1.191V10.041a1.2 1.2 0 0 0-1.194-1.191"
                  style="opacity:.2;isolation:isolate" />
                <path d="M15.783 8.85H8.512V23.8h7.271a1.2 1.2 0 0 0 1.194-1.191V10.041a1.2 1.2 0 0 0-1.194-1.191"
                  style="opacity:.2;isolation:isolate" />
                <path d="M15.132 8.85h-6.62V23.8h6.62a1.2 1.2 0 0 0 1.194-1.191V10.041a1.2 1.2 0 0 0-1.194-1.191"
                  style="opacity:.2;isolation:isolate" />
                <path
                  d="M3.194 8.85h11.938a1.193 1.193 0 0 1 1.194 1.191v11.918a1.193 1.193 0 0 1-1.194 1.191H3.194A1.19 1.19 0 0 1 2 21.959V10.041A1.19 1.19 0 0 1 3.194 8.85"
                  fill="url(#meiWordGrad)" />
                <path
                  d="M6.9 17.988q.035.276.046.481h.028q.015-.195.065-.47c.05-.275.062-.338.089-.465l1.255-5.407h1.624l1.3 5.326a8 8 0 0 1 .162 1h.022a8 8 0 0 1 .135-.975l1.039-5.358h1.477l-1.824 7.748h-1.727l-1.237-5.126q-.054-.222-.122-.578t-.084-.52h-.021q-.021.189-.084.561t-.1.552L7.78 19.871H6.024L4.19 12.127h1.5l1.131 5.418a5 5 0 0 1 .079.443"
                  style="fill:#fff" />
              </svg>

              <!-- Excel SVG -->
              <svg *ngIf="resolverTipoDocumento(sel) === 'excel'" viewBox="0 0 32 32" width="50" height="50"
                xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="meiExcelGrad" x1="4.494" y1="-2092.086" x2="13.832" y2="-2075.914"
                    gradientTransform="translate(0 2100)" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#18884f" />
                    <stop offset=".5" stop-color="#117e43" />
                    <stop offset="1" stop-color="#0b6631" />
                  </linearGradient>
                </defs>
                <path d="M19.581 15.35 8.512 13.4v14.409A1.19 1.19 0 0 0 9.705 29h19.1A1.19 1.19 0 0 0 30 27.809V22.5Z"
                  style="fill:#185c37" />
                <path d="M19.581 3H9.705a1.19 1.19 0 0 0-1.193 1.191V9.5L19.581 16l5.861 1.95L30 16V9.5Z"
                  style="fill:#21a366" />
                <path d="M8.512 9.5h11.069V16H8.512Z" style="fill:#107c41" />
                <path d="M16.434 8.2H8.512v16.25h7.922a1.2 1.2 0 0 0 1.194-1.191V9.391A1.2 1.2 0 0 0 16.434 8.2"
                  style="opacity:.1;isolation:isolate" />
                <path d="M15.783 8.85H8.512V25.1h7.271a1.2 1.2 0 0 0 1.194-1.191V10.041a1.2 1.2 0 0 0-1.194-1.191"
                  style="opacity:.2;isolation:isolate" />
                <path d="M15.783 8.85H8.512V23.8h7.271a1.2 1.2 0 0 0 1.194-1.191V10.041a1.2 1.2 0 0 0-1.194-1.191"
                  style="opacity:.2;isolation:isolate" />
                <path d="M15.132 8.85h-6.62V23.8h6.62a1.2 1.2 0 0 0 1.194-1.191V10.041a1.2 1.2 0 0 0-1.194-1.191"
                  style="opacity:.2;isolation:isolate" />
                <path
                  d="M3.194 8.85h11.938a1.193 1.193 0 0 1 1.194 1.191v11.918a1.193 1.193 0 0 1-1.194 1.191H3.194A1.19 1.19 0 0 1 2 21.959V10.041A1.19 1.19 0 0 1 3.194 8.85"
                  fill="url(#meiExcelGrad)" />
                <path
                  d="m5.7 19.873 2.511-3.884-2.3-3.862h1.847L9.013 14.6c.116.234.2.408.238.524h.017q.123-.281.26-.546l1.342-2.447h1.7l-2.359 3.84 2.419 3.905h-1.809l-1.45-2.711A2.4 2.4 0 0 1 9.2 16.8h-.024a1.7 1.7 0 0 1-.168.351l-1.493 2.722Z"
                  style="fill:#fff" />
                <path d="M28.806 3h-9.225v6.5H30V4.191A1.19 1.19 0 0 0 28.806 3" style="fill:#33c481" />
                <path d="M19.581 16H30v6.5H19.581Z" style="fill:#107c41" />
              </svg>

              <!-- PDF SVG -->
              <svg *ngIf="resolverTipoDocumento(sel) === 'pdf'" viewBox="0 0 512 512" width="50" height="50"
                xmlns="http://www.w3.org/2000/svg" aria-label="PDF">
                <rect width="512" height="512" rx="15%" fill="#c80a0a" />
                <path fill="#fff"
                  d="M413 302c-9-10-29-15-56-15-16 0-33 2-53 5a252 252 0 0 1-52-69c10-30 17-59 17-81 0-17-6-44-30-44-7 0-13 4-17 10-10 18-6 58 13 100a898 898 0 0 1-50 117c-53 22-88 46-91 65-2 9 4 24 25 24 31 0 65-45 91-91a626 626 0 0 1 92-24c38 33 71 38 87 38 32 0 35-23 24-35M227 111c8-12 26-8 26 16 0 16-5 42-15 72-18-42-18-75-11-88M100 391c3-16 33-38 80-57-26 44-52 72-68 72-10 0-13-9-12-15m197-98a574 574 0 0 0-83 22 453 453 0 0 0 36-84 327 327 0 0 0 47 62m13 4c32-5 59-4 71-2 29 6 19 41-13 33-23-5-42-18-58-31" />
              </svg>

              <!-- Generic fallback -->
              <svg
                *ngIf="resolverTipoDocumento(sel) !== 'word' && resolverTipoDocumento(sel) !== 'excel' && resolverTipoDocumento(sel) !== 'pdf'"
                viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm0 2.5L18.5 9H14z" />
              </svg>
            </div>
            <div class="doc-card-info">
              <div class="doc-card-name" [title]="sel.name">{{ sel.name || 'Documento' }}</div>
              <div class="doc-card-meta">
                <span class="doc-type-chip" [style.background-color]="estilo.chipBg" [style.color]="estilo.chipText">{{
                  estilo.label }}</span>
                <span class="doc-mime">{{ sel.type || '' }}</span>
              </div>
            </div>
          </div>
          <div class="doc-card-note">
            Vista previa no disponible para este tipo de archivo.
          </div>
        </ng-container>
      </div>
    </ng-container>

    <div *ngIf="!selectedAttachment" class="visor-empty">
      No hay archivos para previsualizar.
    </div>
  </main>

  <!-- Footer con Carrusel e Input Bar estilo WhatsApp iOS -->
  <footer class="modal-footer-ios">
    <!-- Carrusel de archivos adjuntos -->
    <div class="attachments-carousel-bar" *ngIf="attachments && attachments.length > 0">
      <!-- Botón para añadir más archivos -->
      <button type="button" class="btn-add-more" (click)="handlePickMore()" [disabled]="isBusy"
        title="Agregar archivos">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <!-- Lista deslizable de miniaturas -->
      <div class="carousel-items-scroll">
        <div *ngFor="let att of attachments" class="carousel-item-wrapper"
          [class.active]="(selectedAttachment?.id || '') === att.id">
          <button type="button" class="carousel-thumb-btn" (click)="onSelectAttachment(att.id)" [title]="att.name">
            <img *ngIf="att.kind === 'image' && att.preview" [src]="att.preview" [alt]="att.name" class="thumb-img" />
            <video *ngIf="att.kind === 'video' && att.preview" [src]="att.preview" class="thumb-img" muted></video>
            <div *ngIf="att.kind === 'audio'" class="thumb-fallback">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3m7 9a7 7 0 0 1-14 0H3a9 9 0 0 0 18 0z" />
              </svg>
              <span>Audio</span>
            </div>
            <div *ngIf="att.kind === 'document'" class="thumb-fallback" style="padding: 2px;">
              <svg *ngIf="resolverTipoDocumento(att) === 'word'" viewBox="0 0 32 32" width="22" height="22"
                xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="meiWordGradThumb" x1="4.494" y1="-1712.086" x2="13.832" y2="-1695.914"
                    gradientTransform="translate(0 1720)" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#2368c4" />
                    <stop offset=".5" stop-color="#1a5dbe" />
                    <stop offset="1" stop-color="#1146ac" />
                  </linearGradient>
                </defs>
                <path
                  d="M28.806 3H9.705a1.19 1.19 0 0 0-1.193 1.191V9.5l11.069 3.25L30 9.5V4.191A1.19 1.19 0 0 0 28.806 3"
                  style="fill:#41a5ee" />
                <path d="M30 9.5H8.512V16l11.069 1.95L30 16Z" style="fill:#2b7cd3" />
                <path d="M8.512 16v6.5l10.418 1.3L30 22.5V16Z" style="fill:#185abd" />
                <path d="M9.705 29h19.1A1.19 1.19 0 0 0 30 27.809V22.5H8.512v5.309A1.19 1.19 0 0 0 9.705 29"
                  style="fill:#103f91" />
                <path
                  d="M3.194 8.85h11.938a1.193 1.193 0 0 1 1.194 1.191v11.918a1.193 1.193 0 0 1-1.194 1.191H3.194A1.19 1.19 0 0 1 2 21.959V10.041A1.19 1.19 0 0 1 3.194 8.85"
                  fill="url(#meiWordGradThumb)" />
                <path
                  d="M6.9 17.988q.035.276.046.481h.028q.015-.195.065-.47c.05-.275.062-.338.089-.465l1.255-5.407h1.624l1.3 5.326a8 8 0 0 1 .162 1h.022a8 8 0 0 1 .135-.975l1.039-5.358h1.477l-1.824 7.748h-1.727l-1.237-5.126q-.054-.222-.122-.578t-.084-.52h-.021q-.021.189-.084.561t-.1.552L7.78 19.871H6.024L4.19 12.127h1.5l1.131 5.418a5 5 0 0 1 .079.443"
                  style="fill:#fff" />
              </svg>

              <svg *ngIf="resolverTipoDocumento(att) === 'excel'" viewBox="0 0 32 32" width="22" height="22"
                xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="meiExcelGradThumb" x1="4.494" y1="-2092.086" x2="13.832" y2="-2075.914"
                    gradientTransform="translate(0 2100)" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#18884f" />
                    <stop offset=".5" stop-color="#117e43" />
                    <stop offset="1" stop-color="#0b6631" />
                  </linearGradient>
                </defs>
                <path d="M19.581 15.35 8.512 13.4v14.409A1.19 1.19 0 0 0 9.705 29h19.1A1.19 1.19 0 0 0 30 27.809V22.5Z"
                  style="fill:#185c37" />
                <path d="M19.581 3H9.705a1.19 1.19 0 0 0-1.193 1.191V9.5L19.581 16l5.861 1.95L30 16V9.5Z"
                  style="fill:#21a366" />
                <path d="M8.512 9.5h11.069V16H8.512Z" style="fill:#107c41" />
                <path
                  d="M3.194 8.85h11.938a1.193 1.193 0 0 1 1.194 1.191v11.918a1.193 1.193 0 0 1-1.194 1.191H3.194A1.19 1.19 0 0 1 2 21.959V10.041A1.19 1.19 0 0 1 3.194 8.85"
                  fill="url(#meiExcelGradThumb)" />
                <path
                  d="m5.7 19.873 2.511-3.884-2.3-3.862h1.847L9.013 14.6c.116.234.2.408.238.524h.017q.123-.281.26-.546l1.342-2.447h1.7l-2.359 3.84 2.419 3.905h-1.809l-1.45-2.711A2.4 2.4 0 0 1 9.2 16.8h-.024a1.7 1.7 0 0 1-.168.351l-1.493 2.722Z"
                  style="fill:#fff" />
                <path d="M28.806 3h-9.225v6.5H30V4.191A1.19 1.19 0 0 0 28.806 3" style="fill:#33c481" />
                <path d="M19.581 16H30v6.5H19.581Z" style="fill:#107c41" />
              </svg>

              <svg *ngIf="resolverTipoDocumento(att) === 'pdf'" viewBox="0 0 512 512" width="22" height="22"
                xmlns="http://www.w3.org/2000/svg" aria-label="PDF">
                <rect width="512" height="512" rx="15%" fill="#c80a0a" />
                <path fill="#fff"
                  d="M413 302c-9-10-29-15-56-15-16 0-33 2-53 5a252 252 0 0 1-52-69c10-30 17-59 17-81 0-17-6-44-30-44-7 0-13 4-17 10-10 18-6 58 13 100a898 898 0 0 1-50 117c-53 22-88 46-91 65-2 9 4 24 25 24 31 0 65-45 91-91a626 626 0 0 1 92-24c38 33 71 38 87 38 32 0 35-23 24-35M227 111c8-12 26-8 26 16 0 16-5 42-15 72-18-42-18-75-11-88M100 391c3-16 33-38 80-57-26 44-52 72-68 72-10 0-13-9-12-15m197-98a574 574 0 0 0-83 22 453 453 0 0 0 36-84 327 327 0 0 0 47 62m13 4c32-5 59-4 71-2 29 6 19 41-13 33-23-5-42-18-58-31" />
              </svg>

              <svg
                *ngIf="resolverTipoDocumento(att) !== 'word' && resolverTipoDocumento(att) !== 'excel' && resolverTipoDocumento(att) !== 'pdf'"
                viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm0 2.5L18.5 9H14z" />
              </svg>
              <span>{{ resolverTipoDocumento(att) === 'word' ? 'Word' : resolverTipoDocumento(att) === 'excel' ? 'Excel'
                : resolverTipoDocumento(att) === 'pdf' ? 'PDF' : 'Doc' }}</span>
            </div>
          </button>

          <!-- Botón rojo para quitar archivo -->
          <button type="button" class="btn-remove-thumb" (click)="onRemoveAttachment(att.id, $event)"
            [disabled]="isBusy" title="Quitar">
            <span>×</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Barra de Input estilo WhatsApp iOS -->
    <div class="modal-input-bar">
      <!-- Botón más si no hay elementos -->
      <button *ngIf="!attachments || attachments.length === 0" type="button" class="btn-input-add"
        (click)="handlePickMore()" [disabled]="isBusy" title="Adjuntar archivo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <!-- Input de comentario -->
      <div class="modal-textarea-wrap">
        <textarea #captionInput [(ngModel)]="captionActual" (input)="handleCaptionInput($event)"
          (keydown)="handleCaptionKeydown($event)" placeholder="Añade un comentario..." rows="1"
          [disabled]="isBusy"></textarea>
      </div>

      <!-- Botón Enviar estilo WhatsApp -->
      <button type="button" class="btn-modal-send" (click)="handleSend()" [disabled]="isBusy" title="Enviar">
        <div *ngIf="isBusy" class="send-spinner"></div>
        <svg *ngIf="!isBusy" viewBox="0 0 24 24" height="24" width="24" fill="none">
          <path fill="currentColor"
            d="M5.4 19.43a.99.99 0 0 1-.95-.1.93.93 0 0 1-.45-.83V14l8-2-8-2V5.5c0-.37.15-.65.45-.84a1 1 0 0 1 .95-.09l15.4 6.5c.42.19.63.5.63.93 0 .43-.21.74-.63.93l-15.4 6.5Z" />
        </svg>
      </button>
    </div>
  </footer>

  <!-- Input oculto para añadir más archivos -->
  <input #inputAgregar type="file" multiple
    accept="image/*,video/*,application/pdf,text/html,.doc,.docx,.xls,.xlsx,.ppt,.pptx" (change)="onFileChange($event)"
    style="display: none" />
</div>
