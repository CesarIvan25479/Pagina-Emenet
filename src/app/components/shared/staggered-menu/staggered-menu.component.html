<div class="sm-wrapper" [style.--sm-accent]="accentColor" [class.is-open]="open">

  <!-- Barra de cabecera móvil -->
  <header class="sm-mobile-navbar" aria-label="Navegación móvil">
    <div class="sm-logo">
      <a routerLink="/" aria-label="Inicio" (click)="closeMenu()">
        <img [src]="logoUrl" alt="Logo Emenet" class="sm-logo-img" width="165" height="54" />
      </a>
    </div>

    <div class="sm-navbar-actions">
      <!-- Acciones proyectadas (ej. botón Llamar) -->
      <ng-content select="[menu-actions]"></ng-content>

      <!-- Botón Toggle Menú Hamburguesa (Solo icono) -->
      <button class="sm-toggle-btn" (click)="toggleMenu()" type="button"
        [attr.aria-label]="open ? 'Cerrar menú' : 'Abrir menú'" [attr.aria-expanded]="open">
        <span class="sm-toggle-icon" [class.is-active]="open">
          <span class="sm-icon-line sm-icon-line-1"></span>
          <span class="sm-icon-line sm-icon-line-2"></span>
          <span class="sm-icon-line sm-icon-line-3"></span>
        </span>
      </button>
    </div>
  </header>

  <!-- Overlay de pantalla completa para el Menú Móvil -->
  <div class="sm-drawer-overlay" [class.active]="open" (click)="closeMenu()">

    <!-- Capas animadas escalonadas de fondo (Prelayers) -->
    <div class="sm-prelayers-container" (click)="$event.stopPropagation()">
      <div *ngFor="let c of processedColors; let i = index" class="sm-prelayer-stripe" [style.background]="c"
        [style.transition-delay]="(i * 0.06) + 's'">
      </div>
    </div>

    <!-- Panel principal de navegación -->
    <aside class="sm-menu-panel" (click)="$event.stopPropagation()" [attr.aria-hidden]="!open">

      <!-- Header dentro del panel desplegado -->
      <div class="sm-panel-header">
        <div class="sm-logo sm-panel-logo">
          <a routerLink="/" aria-label="Inicio" (click)="closeMenu()">
            <img [src]="logoUrl" alt="Logo Emenet" class="sm-logo-img" width="165" height="54" />
          </a>
        </div>
        <button type="button" class="sm-panel-close-btn" (click)="closeMenu()" aria-label="Cerrar menú">
          <span class="sm-close-x">&#x2715;</span>
        </button>
      </div>

      <!-- Lista de enlaces de navegación escalonados -->
      <div class="sm-panel-content">
        <nav class="sm-nav-list" role="navigation">
          <div *ngFor="let it of items; let idx = index" class="sm-nav-row"
            [style.transition-delay]="(0.12 + idx * 0.05) + 's'">
            <a  class="sm-nav-link" (click)="onItemClick(it, $event)"
              [attr.aria-label]="it.ariaLabel || it.label">
              <span class="sm-nav-label">{{ it.label }}</span>
              <span *ngIf="displayItemNumbering" class="sm-nav-number">
                {{ (idx + 1) < 10 ? '0' + (idx + 1) : (idx + 1) }} </span>
            </a>
          </div>
        </nav>

        <!-- Sección de redes sociales al pie -->
        <div *ngIf="displaySocials && socialItems && socialItems.length > 0" class="sm-socials-box">
          <span class="sm-socials-heading">Redes Sociales</span>
          <div class="sm-socials-links">
            <a *ngFor="let s of socialItems" [href]="s.link" target="_blank" rel="noopener noreferrer"
              class="sm-social-link" [attr.aria-label]="s.label">
              <span class="sm-social-icon" [ngSwitch]="(s.label || '').toLowerCase()">
                <!-- WhatsApp SVG -->
                <svg *ngSwitchCase="'whatsapp'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 58"
                  xml:space="preserve">
                  <path style="fill:#2cb742"
                    d="m0 58 4.988-14.963A28.35 28.35 0 0 1 1 28.5C1 12.76 13.76 0 29.5 0S58 12.76 58 28.5 45.24 57 29.5 57a28.4 28.4 0 0 1-13.26-3.273z" />
                  <path style="fill:#fff"
                    d="M47.683 37.985c-1.316-2.487-6.169-5.331-6.169-5.331-1.098-.626-2.423-.696-3.049.42 0 0-1.577 1.891-1.978 2.163-1.832 1.241-3.529 1.193-5.242-.52l-3.981-3.981-3.981-3.981c-1.713-1.713-1.761-3.41-.52-5.242.272-.401 2.163-1.978 2.163-1.978 1.116-.627 1.046-1.951.42-3.049 0 0-2.844-4.853-5.331-6.169a2.73 2.73 0 0 0-3.203.482l-1.758 1.758c-5.577 5.577-2.831 11.873 2.746 17.45l5.097 5.097 5.097 5.097c5.577 5.577 11.873 8.323 17.45 2.746l1.758-1.758a2.73 2.73 0 0 0 .481-3.204" />
                </svg>

                <!-- Instagram SVG -->
                <svg *ngSwitchCase="'instagram'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 551.034 551.034"
                  xml:space="preserve">
                  <linearGradient id="sm-insta-a" gradientUnits="userSpaceOnUse" x1="275.517" y1="4.571" x2="275.517"
                    y2="549.72" gradientTransform="matrix(1 0 0 -1 0 554)">
                    <stop offset="0" style="stop-color:#e09b3d" />
                    <stop offset=".3" style="stop-color:#c74c4d" />
                    <stop offset=".6" style="stop-color:#c21975" />
                    <stop offset="1" style="stop-color:#7024c4" />
                  </linearGradient>
                  <path style="fill:url(#sm-insta-a)"
                    d="M386.878 0H164.156C73.64 0 0 73.64 0 164.156v222.722c0 90.516 73.64 164.156 164.156 164.156h222.722c90.516 0 164.156-73.64 164.156-164.156V164.156C551.033 73.64 477.393 0 386.878 0M495.6 386.878c0 60.045-48.677 108.722-108.722 108.722H164.156c-60.045 0-108.722-48.677-108.722-108.722V164.156c0-60.046 48.677-108.722 108.722-108.722h222.722c60.045 0 108.722 48.676 108.722 108.722z" />
                  <linearGradient id="sm-insta-b" gradientUnits="userSpaceOnUse" x1="275.517" y1="4.571" x2="275.517"
                    y2="549.72" gradientTransform="matrix(1 0 0 -1 0 554)">
                    <stop offset="0" style="stop-color:#e09b3d" />
                    <stop offset=".3" style="stop-color:#c74c4d" />
                    <stop offset=".6" style="stop-color:#c21975" />
                    <stop offset="1" style="stop-color:#7024c4" />
                  </linearGradient>
                  <path style="fill:url(#sm-insta-b)"
                    d="M275.517 133C196.933 133 133 196.933 133 275.516s63.933 142.517 142.517 142.517S418.034 354.1 418.034 275.516 354.101 133 275.517 133m0 229.6c-48.095 0-87.083-38.988-87.083-87.083s38.989-87.083 87.083-87.083 87.083 38.988 87.083 87.083-38.989 87.083-87.083 87.083" />
                  <linearGradient id="sm-insta-c" gradientUnits="userSpaceOnUse" x1="418.306" y1="4.571" x2="418.306"
                    y2="549.72" gradientTransform="matrix(1 0 0 -1 0 554)">
                    <stop offset="0" style="stop-color:#e09b3d" />
                    <stop offset=".3" style="stop-color:#c74c4d" />
                    <stop offset=".6" style="stop-color:#c21975" />
                    <stop offset="1" style="stop-color:#7024c4" />
                  </linearGradient>
                  <circle style="fill:url(#sm-insta-c)" cx="418.306" cy="134.072" r="34.149" />
                </svg>

                <!-- Facebook SVG -->
                <svg *ngSwitchCase="'facebook'" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="none">
                  <path fill="#1877f2"
                    d="M15 8a7 7 0 0 0-7-7 7 7 0 0 0-1.094 13.915v-4.892H5.13V8h1.777V6.458c0-1.754 1.045-2.724 2.644-2.724.766 0 1.567.137 1.567.137v1.723h-.883c-.87 0-1.14.54-1.14 1.093V8h1.941l-.31 2.023H9.094v4.892A7 7 0 0 0 15 8" />
                  <path fill="#fff"
                    d="M10.725 10.023 11.035 8H9.094V6.687c0-.553.27-1.093 1.14-1.093h.883V3.87s-.801-.137-1.567-.137c-1.6 0-2.644.97-2.644 2.724V8H5.13v2.023h1.777v4.892a7 7 0 0 0 2.188 0v-4.892z" />
                </svg>
              </span>
            </a>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>
